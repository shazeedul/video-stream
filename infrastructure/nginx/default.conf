server {
    listen 80;
    server_name localhost;

    client_max_body_size 500M;

    resolver 127.0.0.11 valid=30s ipv6=off;

    location ^~ /api/v1/internal/playback/auth {
        return 404;
    }

    location = /internal-playback-auth {
        internal;
        proxy_pass http://panel:8000/api/v1/internal/playback/auth?$args;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Video-Id $video_id;
        proxy_set_header Host $http_host;
    }

    location ~ ^/playback/(?<video_id>[a-f0-9\-]+)/(?<asset_path>.*)$ {
        auth_request /internal-playback-auth;
        auth_request_set $tenant_id $upstream_http_x_tenant_id;

        proxy_pass http://minio:9000/videos-processed/tenants/$tenant_id/videos/$video_id/hls/$asset_path;
        proxy_http_version 1.1;
        proxy_set_header Host minio:9000;

        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS' always;
        add_header Access-Control-Allow-Headers '*' always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    location / {
        proxy_pass http://panel:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $http_host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }
}
