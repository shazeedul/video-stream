name: 🚀 Deploy Application

# ==============================================================================
# 📋 REQUIREMENTS & CONFIGURATION
# ==============================================================================
#
# 🔐 REQUIRED SECRETS (Settings > Secrets and variables > Actions > Secrets):
#   - SSH_PRIVATE_KEY ......: Private SSH key for server authentication
#   - SSH_PASSWORD .........: Password for SSH key (if passphrase protected) or user password
#
# 🌍 REQUIRED VARIABLES (Settings > Secrets and variables > Actions > Variables):
#   - SSH_HOST .............: IP address or hostname of the production server
#   - SSH_USER .............: SSH username for connection
#   - SSH_PORT .............: SSH port (usually 22)
#   - DEPLOY_PATH ..........: Absolute path to the project directory on the server
#
# 📢 OPTIONAL VARIABLES (for Notifications):
#   - SLACK_WEBHOOK_URL ....: Webhook URL for Slack notifications
#   - DISCORD_WEBHOOK_URL ..: Webhook URL for Discord notifications
#   - TEAMS_WEBHOOK_URL ....: Webhook URL for Microsoft Teams notifications
#   - GENERIC_WEBHOOK_URL ..: URL for generic JSON webhook notifications
# ==============================================================================

on:
  # workflow_run:
  #   workflows: ['tests']
  #   types:
  #     - completed
  #   branches:
  #     - production
  # release:
  #   types: [published]
  workflow_dispatch:
    inputs:
      repo_branch:
        description: 'Branch or tag to deploy (default: main branch)'
        required: false
        default: 'main'

jobs:
  deploy:
    name: 🚀 Deploy Application
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7

      - name: 🚀 Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          port: ${{ vars.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          envs: DEPLOY_PATH,DEPLOYMENT_BRANCH,RELEASE_ID,SKIP_GIT_PULL
          script: |
            set -e

            # Navigate to project directory and execute deployment script
            cd "$DEPLOY_PATH" || exit 1

            # Fetch all refs (branches and tags)
            git fetch --all --tags

            # Checkout the deployment target (branch or tag)
            if git show-ref --verify --quiet "refs/heads/$DEPLOYMENT_BRANCH"; then
              # It's a branch
              git checkout "$DEPLOYMENT_BRANCH"
              git reset --hard "origin/$DEPLOYMENT_BRANCH"
              git pull origin "$DEPLOYMENT_BRANCH"
            elif git show-ref --verify --quiet "refs/tags/$DEPLOYMENT_BRANCH"; then
              # It's a tag
              git checkout "tags/$DEPLOYMENT_BRANCH"
            else
              # Try as a commit hash or remote branch
              git checkout "$DEPLOYMENT_BRANCH"
            fi

            # Make script executable and run it
            chmod +x .github/scripts/deploy.sh
            .github/scripts/deploy.sh
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOYMENT_BRANCH: ${{ github.event.inputs.repo_branch || github.event.release.tag_name || 'main' }}
          RELEASE_ID: ${{ github.event.release.tag_name || github.event.inputs.repo_branch || github.run_id }}
          SKIP_GIT_PULL: 'true'

  notify:
    name: 📢 Send Notifications
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always()

    permissions:
      contents: read # Required for checking out the repository

    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: 📢 Send Notifications with Release Notes
        env:
          SLACK_WEBHOOK_URL: ${{ vars.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ vars.DISCORD_WEBHOOK_URL }}
          TEAMS_WEBHOOK_URL: ${{ vars.TEAMS_WEBHOOK_URL }}
          GENERIC_WEBHOOK_URL: ${{ vars.GENERIC_WEBHOOK_URL }}
          DEPLOYMENT_STATUS: ${{ needs.deploy.result || 'skipped' }}
          RELEASE_ID: ${{ github.event.release.tag_name || github.event.inputs.repo_branch || github.run_id }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_NAME: ${{ github.event.release.name }}
          ENVIRONMENT: production
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          # GitHub token is automatically provided for API access with higher rate limits
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🚀 Starting deployment notifications..."
          echo "Deployment Status: ${{ needs.deploy.result || 'skipped' }}"
          echo "Event Name: ${{ github.event_name }}"
          echo "Release Tag: ${{ github.event.release.tag_name }}"
          echo "Release ID: ${{ github.event.release.tag_name || github.event.inputs.repo_branch || github.run_id }}"

          chmod +x .github/scripts/notify.sh
          .github/scripts/notify.sh
