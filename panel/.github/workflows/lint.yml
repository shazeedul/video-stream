name: linter

on:
  push:
    branches:
      - dev
      - main
    paths:
      - '**.php'
      - 'composer.json'
      - 'composer.lock'
      - 'pint.json'
      - '.github/workflows/lint.yml'
  pull_request:
    branches:
      - dev
      - main
    paths:
      - '**.php'
      - 'composer.json'
      - 'composer.lock'
      - 'pint.json'
      - '.github/workflows/lint.yml'

# Cancel in-progress runs for the same workflow and branch (optimized)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Cache Dependencies
        uses: actions/cache@v6
        with:
          path: |
            vendor
            ~/.local/share/pnpm/store
          key: ${{ runner.os }}-deps-${{ hashFiles('**/composer.lock', '**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      - name: Install Dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist --optimize-autoloader
          pnpm install --frozen-lockfile

      - name: Run Lint
        run: composer lint

      - name: Commit Changes
        if: github.event_name == 'push'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'chore: fix code style and linting issues'
          commit_options: '--no-verify'
          push_options: '--force-with-lease'
