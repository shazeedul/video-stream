services:
  postgres:
    image: postgres:16-alpine
    container_name: wiz_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: wiz_video
      POSTGRES_USER: wiz_user
      POSTGRES_PASSWORD: secret
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wiz_user -d wiz_video"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: wiz_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: wiz_rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: wiz_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports:
      - "9000:9000"
      - "${MINIO_CONSOLE_PORT:-9002}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  panel:
    build:
      context: ./panel
      dockerfile: Dockerfile
    container_name: wiz_panel
    restart: unless-stopped
    ports:
      - "${PANEL_PORT:-8080}:8000"
    environment:
      APP_ENV: local
      APP_KEY: "${APP_KEY:-base64:65PvjS8hFW5flf2r/XRgU1CdpIYmQ6rGmtTz6dOnA7I=}"
      APP_DEBUG: "true"
      APP_URL: "${APP_URL:-http://localhost:8088}"
      PLAYBACK_URL: "${PLAYBACK_URL:-http://localhost:8088}"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: wiz_video
      DB_USERNAME: wiz_user
      DB_PASSWORD: secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PRESIGNED_ENDPOINT: "${MINIO_PRESIGNED_ENDPOINT:-http://localhost:9000}"
      MINIO_URL: http://localhost:9000/videos-original
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      INTERNAL_API_SECRET: "${INTERNAL_API_SECRET:-internal-worker-secret-key-12345}"
      PHP_CLI_SERVER_WORKERS: 12
      DEBUGBAR_ENABLED: "false"
    volumes:
      - ./panel:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: wiz_worker
    restart: unless-stopped
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      RABBITMQ_QUEUE: media.jobs
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_USE_SSL: "false"
      INTERNAL_CALLBACK_URL: http://panel:8000/api/v1/internal/processing/callback
      INTERNAL_HEARTBEAT_URL: http://panel:8000/api/v1/internal/worker/heartbeat
      INTERNAL_API_SECRET: "${INTERNAL_API_SECRET:-internal-worker-secret-key-12345}"
      CONCURRENCY: 2
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      panel:
        condition: service_started

  nginx:
    image: nginx:alpine
    container_name: wiz_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8088}:80"
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      panel:
        condition: service_started
      minio:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
